[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-renamer"
version = "3.2.0"
description = "Media Renamer & Organizer for TV series, movies, books and comics using TMDb/TheTVDB/Open Library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Media Renamer Contributors"}
]
dependencies = [
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "yt-dlp>=2024.1.1",
]
[project.optional-dependencies]
gui = []
thetvdb = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.6",
]

[project.scripts]
media-renamer = "media_renamer.main:main"
media-renamer-gui = "media_renamer.gui:run_gui"
media-renamer-gui-modern = "media_renamer.gui_ctk:run_gui"

[project.urls]
Homepage = "https://github.com/yourusername/media_renamer"
Repository = "https://github.com/yourusername/media_renamer"
Issues = "https://github.com/yourusername/media_renamer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["media_renamer*"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "B", "COM", "DTZ", "EXE", "FA", "ISC", "ICN", "LOG", "PIE", "PT", "Q", "RET", "RSE", "SIM", "TCH", "TID", "TRY", "PTH", "ERA", "PD", "PL", "RUF", "NPY", "T20"]
ignore = ["ANN101", "ANN102", "ARG001", "ARG002", "B008", "C901", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "EXE002", "FA100", "ISC001", "LOG001", "PIE001", "PL001", "PL002", "RET503", "T201", "T203", "TRY003", "PTH118", "ERA001"]
fixable = ["ALL"]
unfixable = ["ANN", "ARG", "COM", "DTZ", "EXE", "FA", "ISC", "ICN", "LOG", "PIE", "PT", "Q", "RET", "RSE", "SIM", "TCH", "TID", "TRY", "PTH", "ERA", "PD", "PL", "RUF", "NPY", "T20"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]